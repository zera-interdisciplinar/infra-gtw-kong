apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-artificial-intelligence-core-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "api-key-auth"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - www.zeratech.online
      secretName: gateway-tls
  rules:
  - http:
      paths:
      - path: /ai-core
        pathType: Prefix
        backend:
          service:
            name: ms-artificial-intelligence-core
            port:
              number: 80