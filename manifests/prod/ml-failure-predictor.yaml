apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: mcp-path-rewrite
  namespace: production
plugin: request-transformer
config:
  replace:
    uri: /mcp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-failure-predictor-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "mcp-path-rewrite"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /predictor
        pathType: Prefix
        backend:
          service:
            name: ml-failure-predictor
            port:
              number: 8000
