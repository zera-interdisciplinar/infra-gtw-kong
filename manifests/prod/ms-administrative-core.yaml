apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-administrative-core-ingress-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "api-key-auth"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /administrative
        pathType: Prefix
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 80