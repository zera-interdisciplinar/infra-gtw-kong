apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-administrative-core-ingress-prod
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "api-key-auth"
spec:
  rules:
  - http:
      paths:
      - path: /api/v1                    # Mapeia /api/v1 sem alterar o caminho
        pathType: Prefix
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 8080