# Rotas de API do ms-administrative-core: exigem JWT de usuario (RS256).
# As rotas publicas (/api/v1/auth/*, /api/v1/invitations/redeem, /.well-known/jwks.json)
# sao servidas pelo Ingress ms-administrative-core-public (regex, prioridade maior).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-administrative-core-ingress-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "jwt-auth"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /administrative
        pathType: Prefix
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 80
---
# Rotas publicas (sem JWT): login/refresh/logout, redeem de convite e a chave JWKS.
# (redeem = registro de funcionario que ainda nao tem conta/token.)
# A regex casa e remove apenas o prefixo /administrative (lookahead nao consome),
# entao o backend recebe /api/v1/... intacto.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-administrative-core-public-prod
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "api-key-auth,auth-rate-limit"
    konghq.com/strip-path: "true"
    konghq.com/regex-priority: "1000"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /~/administrative(?=/(api/v1/auth|api/v1/invitations/redeem|\.well-known/jwks\.json))
        pathType: ImplementationSpecific
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 80
