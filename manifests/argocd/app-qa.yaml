apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gtw-kong-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zera-interdisciplinar/infra-gtw-kong.git
    targetRevision: main
    path: manifests/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
