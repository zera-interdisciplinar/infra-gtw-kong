# Sem api-key-auth de proposito: doc do swagger fica publica em QA para facilitar
# consulta, enquanto as rotas de API de verdade continuam exigindo a chave
# (ver ms-administrative-core-ingress-qa). Nao exponha essa rota assim em prod.
# O path e /api-docs, nao /v3: o ms-administrative-core sobrescreve
# springdoc.api-docs.path=/api-docs no application.properties, entao o spec
# nao fica em /v3/api-docs (padrao do springdoc) e esse prefixo nunca bateria.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-administrative-core-swagger-qa
  namespace: qa
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /qa/administrative/swagger-ui
        pathType: Prefix
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 80
      - path: /qa/administrative/api-docs
        pathType: Prefix
        backend:
          service:
            name: ms-administrative-core
            port:
              number: 80