apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-inventory-ingress-qa
  namespace: qa
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "jwt-auth"
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /qa/inventory
        pathType: Prefix
        backend:
          service:
            name: ms-inventory
            port:
              number: 80
